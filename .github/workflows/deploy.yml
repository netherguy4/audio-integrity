name: Deploy

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check that the commit is still current
        id: current
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current_sha" = "$CANDIDATE_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $CANDIDATE_SHA; main is $current_sha"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the verified commit
        if: steps.current.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        if: steps.current.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.current.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the production image
        if: steps.current.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy the published image with Dokploy
        if: steps.current.outputs.deploy == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          : "${DOKPLOY_URL:?DOKPLOY_URL secret is required}"
          : "${DOKPLOY_API_TOKEN:?DOKPLOY_API_TOKEN secret is required}"
          : "${DOKPLOY_COMPOSE_ID:?DOKPLOY_COMPOSE_ID secret is required}"
          payload="$(jq -n \
            --arg compose_id "$DOKPLOY_COMPOSE_ID" \
            --arg title "GitHub Actions ${DEPLOY_SHA:0:7}" \
            --arg description "$DEPLOY_SHA" \
            '{composeId: $compose_id, title: $title, description: $description}')"
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_TOKEN" \
            --data "$payload" \
            "${DOKPLOY_URL%/}/api/compose.deploy"
