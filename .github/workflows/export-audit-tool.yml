name: Export pinned audit scanner
on:
  push:
    branches: [audit/public-secret-review-20260913]
    paths: [.github/workflows/export-audit-tool.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'netherguy4/audio-integrity' && github.ref == 'refs/heads/audit/public-secret-review-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract scanner from the already reviewed immutable image
        run: |
          image=ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull "$image"
          container=$(docker create "$image")
          mkdir scanner
          docker cp "$container:/usr/bin/gitleaks" scanner/gitleaks
          docker rm "$container"
          chmod +x scanner/gitleaks
          scanner/gitleaks version
          sha256sum scanner/gitleaks > scanner/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-gitleaks-8.30.1
          path: scanner/
          retention-days: 1
          if-no-files-found: error
