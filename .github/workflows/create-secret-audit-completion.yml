name: Complete Create secret audit
on:
  push:
    branches: [audit/public-secret-review-20260913]
    paths: [.github/workflows/create-secret-audit-completion.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'netherguy4/audio-integrity' && github.ref == 'refs/heads/audit/public-secret-review-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/public-secret-audit.py
          sparse-checkout-cone-mode: false
      - name: Scan current Create tree and metadata without executing repository code
        env:
          AUDIT_REPO: netherg-io/create-fabric
          AUDIT_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast
          import io
          import tarfile
          from pathlib import Path
          module = ast.parse(Path('.github/public-secret-audit.py').read_text())
          final = module.body[-1]
          assert isinstance(final, ast.Try)
          exec(compile(ast.Module(body=module.body[:-1], type_ignores=[]), '<audit-helpers>', 'exec'))
          original_api = api
          def api(path, auth=False, cap=64*1024*1024):
              return original_api(path, auth=True, cap=cap)
          try:
              (ROOT/'default.toml').write_text('[extend]\nuseDefault = true\n')
              (ROOT/'empty.ignore').write_text('')
              run(['docker','pull','--quiet',IMAGE], timeout=120)
              run(['git','clone','--bare','--depth=1','--single-branch','--branch=main','--quiet','https://github.com/'+REPO+'.git',str(MIRROR)])
              REPORT['coverage']['scope'] = 'current main tree plus authenticated public metadata; full history scanned in preceding run'
              REPORT['coverage']['main_sha'] = git('rev-parse','refs/heads/main').decode().strip()
              REPORT['coverage']['main_files'] = len([x for x in git('ls-tree','-r','--name-only','-z','main').split(b'\0') if x])
              tree = ROOT/'current-tree'
              tree.mkdir()
              with tarfile.open(fileobj=io.BytesIO(git('archive','main'))) as archive:
                  archive.extractall(tree, filter='data')
              print('AUDIT_STAGE current tree extracted', flush=True)
              scan('dir', tree, 'current_main')
              print('AUDIT_STAGE current tree scanned', flush=True)
              supplemental_audit()
          except Exception as error:
              REPORT['errors'].append({'audit_error_type':type(error).__name__})
          finally:
              exec(compile(ast.Module(body=final.finalbody, type_ignores=[]), '<encrypted-report>', 'exec'))
          PY
