name: One-time CI artifact secret audit
on:
  push:
    branches: [audit/public-secret-review-20260913]
    paths:
      - .github/workflows/public-artifact-audit.yml
      - .github/public-artifact-audit.py
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'netherguy4/audio-integrity' && github.ref == 'refs/heads/audit/public-secret-review-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repository:
          - uPack-dev/strapi-nuxt-ua-template
          - netherg-io/create-fabric
          - netherg-io/simplebedrockmodel-fabric
          - netherguy4/audio-integrity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/public-secret-audit.py
            .github/public-artifact-audit.py
          sparse-checkout-cone-mode: false
      - name: Scan downloadable artifacts; never execute them
        env:
          AUDIT_REPO: ${{ matrix.repository }}
          AUDIT_READ_TOKEN: ${{ github.token }}
        run: python3 .github/public-artifact-audit.py
