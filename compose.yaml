services:
  audio-integrity:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_TOKEN: ${SESSION_TOKEN:?set SESSION_TOKEN}
      LIDARR_TOKEN: ${LIDARR_TOKEN:?set LIDARR_TOKEN}
    volumes:
      - audio-integrity-data:/data
      - /srv/media/music:/music:ro
      - /srv/media/downloads:/downloads:ro
      - /srv/media/import/lidarr-manual:/manual-import:ro
    networks:
      - dokploy-network

volumes:
  audio-integrity-data:

networks:
  dokploy-network:
    external: true

